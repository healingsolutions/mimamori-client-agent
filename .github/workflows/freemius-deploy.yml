name: Deploy to Freemius

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Freemius release mode
        required: true
        default: pending
        type: choice
        options:
          - pending
          - beta
          - released

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        run: |
          find . -name "*.php" -not -path "./dist/*" -print0 | xargs -0 -n1 php -l

      - name: Detect version
        id: version
        run: |
          VERSION=$(php -r '$file=file_get_contents("mimamori-client-agent.php"); preg_match("/Version:\s*([^\r\n]+)/", $file, $m); echo trim($m[1] ?? "");')
          if [ -z "$VERSION" ]; then
            echo "Could not detect plugin version." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Freemius ZIP
        env:
          FREEMIUS_PRODUCT_ID: ${{ secrets.FREEMIUS_PRODUCT_ID }}
          FREEMIUS_API_TOKEN: ${{ secrets.FREEMIUS_API_TOKEN }}
        run: |
          if [ -z "$FREEMIUS_PRODUCT_ID" ] || [ -z "$FREEMIUS_API_TOKEN" ]; then
            echo "FREEMIUS_PRODUCT_ID and FREEMIUS_API_TOKEN secrets are required." >&2
            exit 1
          fi

          SLUG="mimamori-client-agent"
          VERSION="${{ steps.version.outputs.version }}"
          rm -rf dist
          mkdir -p "dist/package/$SLUG"
          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude="dist" \
            --exclude="tools" \
            --exclude=".gitignore" \
            --exclude=".gitattributes" \
            --exclude="README.md" \
            --exclude="IMPLEMENTATION-NOTES-*.md" \
            ./ "dist/package/$SLUG/"

          PRODUCT_JSON=$(curl -sS "https://api.freemius.com/v1/products/$FREEMIUS_PRODUCT_ID.json?fields=id,public_key,slug,title" \
            -H "Authorization: Bearer $FREEMIUS_API_TOKEN")
          PUBLIC_KEY=$(PRODUCT_JSON="$PRODUCT_JSON" python - <<'PY'
          import json
          import os
          data = json.loads(os.environ["PRODUCT_JSON"])
          print(data.get("public_key", ""))
          PY
          )

          if [ -z "$PUBLIC_KEY" ]; then
            echo "Could not retrieve Freemius public_key for SDK initialization." >&2
            exit 1
          fi

          curl -sSL "https://github.com/Freemius/wordpress-sdk/archive/refs/heads/master.zip" -o /tmp/freemius-wordpress-sdk.zip
          rm -rf /tmp/freemius-wordpress-sdk
          unzip -q /tmp/freemius-wordpress-sdk.zip -d /tmp/freemius-wordpress-sdk
          SDK_DIR=$(find /tmp/freemius-wordpress-sdk -maxdepth 1 -type d -name "wordpress-sdk-*" | head -n 1)
          if [ -z "$SDK_DIR" ]; then
            echo "Could not locate downloaded Freemius SDK directory." >&2
            exit 1
          fi
          mkdir -p "dist/package/$SLUG/freemius"
          rsync -a "$SDK_DIR/" "dist/package/$SLUG/freemius/"

          PRODUCT_ID="$FREEMIUS_PRODUCT_ID" PUBLIC_KEY="$PUBLIC_KEY" SLUG="$SLUG" python - <<'PY'
          import os
          import textwrap
          from pathlib import Path

          slug = os.environ["SLUG"]
          product_id = os.environ["PRODUCT_ID"]
          public_key = os.environ["PUBLIC_KEY"]
          plugin_file = Path("dist/package") / slug / "mimamori-client-agent.php"
          text = plugin_file.read_text(encoding="utf-8")
          marker = "if (!defined('ABSPATH')) exit;\n"
          snippet = textwrap.dedent("""
              if ( ! function_exists( 'mmca_fs' ) ) {
                  function mmca_fs() {
                      global $mmca_fs;

                      if ( ! isset( $mmca_fs ) ) {
                          require_once dirname(__FILE__) . '/freemius/start.php';

                          $mmca_fs = fs_dynamic_init( array(
                              'id'                  => '__PRODUCT_ID__',
                              'slug'                => 'mimamori-client-agent',
                              'type'                => 'plugin',
                              'public_key'          => '__PUBLIC_KEY__',
                              'is_premium'          => false,
                              'has_premium_version' => false,
                              'has_paid_plans'      => false,
                              'has_addons'          => false,
                              'anonymous_mode'      => true,
                              'menu'                => array(
                                  'slug'       => 'mmca_dashboard',
                                  'first-path' => 'admin.php?page=mmca_dashboard',
                                  'account'    => false,
                                  'contact'    => false,
                                  'support'    => false,
                                  'pricing'    => false,
                              ),
                          ) );
                      }

                      return $mmca_fs;
                  }

                  mmca_fs();
                  do_action( 'mmca_fs_loaded' );
              }
          """)
          snippet = snippet.replace("__PRODUCT_ID__", product_id).replace("__PUBLIC_KEY__", public_key)
          if "function mmca_fs()" not in text:
              text = text.replace(marker, marker + "\n" + snippet + "\n", 1)
          plugin_file.write_text(text, encoding="utf-8")
          PY

          cd dist/package
          zip -r "../$SLUG-$VERSION.zip" "$SLUG"
          cd ../..
          ls -lh "dist/$SLUG-$VERSION.zip"

      - name: Upload to Freemius
        id: upload
        env:
          FREEMIUS_PRODUCT_ID: ${{ secrets.FREEMIUS_PRODUCT_ID }}
          FREEMIUS_API_TOKEN: ${{ secrets.FREEMIUS_API_TOKEN }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          if [ -z "$FREEMIUS_PRODUCT_ID" ] || [ -z "$FREEMIUS_API_TOKEN" ]; then
            echo "FREEMIUS_PRODUCT_ID and FREEMIUS_API_TOKEN secrets are required." >&2
            exit 1
          fi

          SLUG="mimamori-client-agent"
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="dist/$SLUG-$VERSION.zip"

          RESPONSE=$(curl -sS -X POST "https://api.freemius.com/v1/products/$FREEMIUS_PRODUCT_ID/tags.json" \
            -H "Authorization: Bearer $FREEMIUS_API_TOKEN" \
            -F "file=@$ZIP")

          echo "$RESPONSE" > dist/freemius-upload-response.json
          TAG_ID=$(python - <<'PY'
          import json
          with open("dist/freemius-upload-response.json", encoding="utf-8") as f:
              data = json.load(f)
          print(data.get("id", ""))
          PY
          )

          if [ -z "$TAG_ID" ]; then
            cat dist/freemius-upload-response.json
            echo "Freemius upload response did not include a deployment id." >&2
            exit 1
          fi

          echo "tag_id=$TAG_ID" >> "$GITHUB_OUTPUT"

          if [ "$RELEASE_MODE" != "pending" ]; then
            curl -sS -X PUT "https://api.freemius.com/v1/products/$FREEMIUS_PRODUCT_ID/tags/$TAG_ID.json" \
              -H "Authorization: Bearer $FREEMIUS_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data "{\"release_mode\":\"$RELEASE_MODE\",\"has_premium\":false}" \
              > dist/freemius-release-response.json
          fi

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: freemius-package
          path: dist/*.zip
